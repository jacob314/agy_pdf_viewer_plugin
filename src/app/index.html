<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Viewer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-layout="inline">
    <div id="app">
      <!-- Top Toolbar -->
      <header id="toolbar" class="toolbar">
        <div class="toolbar-group toolbar-left">
          <button id="btn-sidebar" class="icon-btn" title="Toggle Thumbnails & Outline (T)" aria-label="Toggle Sidebar">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="2.5" y="3.5" width="15" height="13" rx="2" />
              <line x1="7.5" y1="3.5" x2="7.5" y2="16.5" />
            </svg>
          </button>
          <div class="doc-identity">
            <span id="doc-title" class="doc-title" title="">PDF Viewer</span>
            <span id="doc-meta" class="doc-meta"></span>
          </div>
        </div>

        <div class="toolbar-group toolbar-center">
          <button id="btn-prev" class="icon-btn" title="Previous Page (←)" aria-label="Previous Page" disabled>
            <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="12.5 5 7.5 10 12.5 15" />
            </svg>
          </button>
          <div class="page-nav">
            <input id="page-input" type="text" inputmode="numeric" value="1" aria-label="Current Page" disabled />
            <span class="page-sep">/</span>
            <span id="page-count">—</span>
          </div>
          <button id="btn-next" class="icon-btn" title="Next Page (→)" aria-label="Next Page" disabled>
            <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="7.5 5 12.5 10 7.5 15" />
            </svg>
          </button>
        </div>

        <div class="toolbar-group toolbar-right">
          <div class="segmented" role="group" aria-label="View Mode">
            <button id="mode-single" class="seg-btn active" data-mode="single" title="Single Page (1)">
              <svg viewBox="0 0 18 18" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="4" y="2.5" width="10" height="13" rx="1.4" />
              </svg>
            </button>
            <button id="mode-spread" class="seg-btn" data-mode="spread" title="2-Page Book Spread (S)">
              <svg viewBox="0 0 18 18" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="2" y="3" width="6.5" height="12" rx="1.2" />
                <rect x="9.5" y="3" width="6.5" height="12" rx="1.2" />
              </svg>
            </button>
            <button id="mode-scroll" class="seg-btn" data-mode="scroll" title="Continuous Scroll (C)">
              <svg viewBox="0 0 18 18" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="4" y="1.5" width="10" height="6.5" rx="1.2" />
                <rect x="4" y="10" width="10" height="6.5" rx="1.2" />
              </svg>
            </button>
          </div>

          <div class="zoom-group">
            <button id="btn-zoom-out" class="icon-btn" title="Zoom Out (-)" aria-label="Zoom Out" disabled>
              <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <line x1="5" y1="10" x2="15" y2="10" />
              </svg>
            </button>
            <select id="zoom-select" class="zoom-select" title="Zoom Level" aria-label="Zoom Level" disabled>
              <option value="fit-page">Fit Page</option>
              <option value="fit-width">Fit Width</option>
              <option value="0.5">50%</option>
              <option value="0.75">75%</option>
              <option value="1">100%</option>
              <option value="1.25">125%</option>
              <option value="1.5">150%</option>
              <option value="2">200%</option>
              <option value="3">300%</option>
            </select>
            <button id="btn-zoom-in" class="icon-btn" title="Zoom In (+)" aria-label="Zoom In" disabled>
              <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <line x1="10" y1="5" x2="10" y2="15" />
                <line x1="5" y1="10" x2="15" y2="10" />
              </svg>
            </button>
          </div>

          <button id="btn-rotate" class="icon-btn" title="Rotate 90° Clockwise (R)" aria-label="Rotate" disabled>
            <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15.5 10a5.5 5.5 0 1 1-1.6-3.9L16 8" />
              <polyline points="16 4.5 16 8 12.5 8" />
            </svg>
          </button>

          <button id="btn-search" class="icon-btn" title="Search in PDF (/ or ⌘F)" aria-label="Search" disabled>
            <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
              <circle cx="9" cy="9" r="5" />
              <line x1="13" y1="13" x2="16.8" y2="16.8" />
            </svg>
          </button>

          <button id="btn-save" class="icon-btn" title="Save PDF Locally to ~/Downloads (⌘S)" aria-label="Save PDF Locally" disabled>
            <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 3.5v8.5" />
              <polyline points="6.5 8.8 10 12.3 13.5 8.8" />
              <path d="M4 14.2v1.3a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5v-1.3" />
            </svg>
          </button>

          <button id="btn-reload" class="icon-btn hidden" title="Reload PDF from disk" aria-label="Reload">
            <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.5 10a5.5 5.5 0 0 1 9.4-3.9L15.5 7.5" />
              <polyline points="15.5 4.2 15.5 7.5 12.2 7.5" />
              <path d="M15.5 10a5.5 5.5 0 0 1-9.4 3.9L4.5 12.5" />
              <polyline points="4.5 15.8 4.5 12.5 7.8 12.5" />
            </svg>
          </button>

          <button id="btn-pop-pane" class="pill-btn hidden" title="Open in full-height Side Panel">
            <span>Side Panel</span>
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="11" x2="11.5" y2="4.5" />
              <polyline points="6.5 4.5 11.5 4.5 11.5 9.5" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Multi-PDF Tab Bar (shown when 2-5 PDFs loaded) -->
      <div id="tab-bar" class="tab-bar hidden" role="tablist"></div>

      <!-- Collapsible Search Bar -->
      <div id="search-bar" class="search-bar hidden">
        <div class="search-input-wrap">
          <svg class="search-icon" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <circle cx="9" cy="9" r="5" />
            <line x1="13" y1="13" x2="16.8" y2="16.8" />
          </svg>
          <input id="search-input" type="text" placeholder="Find in document…" autocomplete="off" />
          <span id="search-status" class="search-status"></span>
        </div>
        <button id="btn-search-prev" class="icon-btn" title="Previous Match (Shift+Enter)" disabled>
          <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="5 12.5 10 7.5 15 12.5" />
          </svg>
        </button>
        <button id="btn-search-next" class="icon-btn" title="Next Match (Enter)" disabled>
          <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="5 7.5 10 12.5 15 7.5" />
          </svg>
        </button>
        <button id="btn-search-close" class="icon-btn" title="Close Search (Esc)">
          <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <line x1="5.5" y1="5.5" x2="14.5" y2="14.5" />
            <line x1="14.5" y1="5.5" x2="5.5" y2="14.5" />
          </svg>
        </button>
      </div>

      <!-- Main Workspace: Sidebar + Stage -->
      <div id="workspace" class="workspace">
        <!-- Collapsible Left Sidebar (Thumbnails / Outline) -->
        <aside id="sidebar" class="sidebar hidden">
          <div class="sidebar-tabs">
            <button id="side-tab-thumbs" class="side-tab active">Pages</button>
            <button id="side-tab-outline" class="side-tab">Contents</button>
          </div>
          <div id="thumbs-list" class="thumbs-list"></div>
          <div id="outline-list" class="outline-list hidden"></div>
        </aside>

        <!-- Scrollable PDF Canvas Stage -->
        <main id="stage" class="stage" tabindex="0">
          <div id="pages-container" class="pages-container"></div>

          <!-- Loading Overlay -->
          <div id="loading-overlay" class="overlay hidden">
            <div class="overlay-card">
              <div class="spinner"></div>
              <div id="loading-text" class="overlay-title">Loading PDF…</div>
              <div class="progress-track">
                <div id="loading-bar" class="progress-fill"></div>
              </div>
              <div id="loading-sub" class="overlay-sub"></div>
            </div>
          </div>

          <!-- Error Overlay -->
          <div id="error-overlay" class="overlay hidden">
            <div class="overlay-card error-card">
              <div class="overlay-title">Unable to display PDF</div>
              <div id="error-text" class="overlay-sub"></div>
            </div>
          </div>

          <!-- Empty / Drop State -->
          <div id="empty-overlay" class="overlay hidden">
            <div class="drop-card">
              <svg viewBox="0 0 48 48" width="42" height="42" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 6h16l10 10v26a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" />
                <polyline points="28 6 28 16 38 16" />
                <line x1="16" y1="26" x2="32" y2="26" />
                <line x1="16" y1="32" x2="26" y2="32" />
              </svg>
              <div class="overlay-title">Drop a PDF here to view</div>
              <div class="overlay-sub">Or ask the agent to view any local .pdf file inline</div>
              <label class="file-pick-btn">
                Choose PDF File
                <input id="file-picker" type="file" accept=".pdf,application/pdf" hidden />
              </label>
            </div>
          </div>

          <!-- Drag-over highlight -->
          <div id="drag-overlay" class="drag-overlay hidden">
            <div class="drag-badge">Drop PDF to open</div>
          </div>

          <!-- Save Toast -->
          <div id="save-toast" class="save-toast hidden" role="status" aria-live="polite">
            <span id="save-toast-msg" class="save-toast-msg"></span>
            <button id="btn-toast-copy" class="toast-action hidden" title="Copy full path">Copy Path</button>
            <button id="btn-toast-close" class="toast-close" aria-label="Dismiss">&times;</button>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
