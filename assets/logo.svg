<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="pageGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>
  <!-- Page sheet with ~12% outer margin -->
  <path d="M30 16h44l24 24v66a8 8 0 0 1-8 8H30a8 8 0 0 1-8-8V24a8 8 0 0 1 8-8z"
        fill="url(#pageGrad)" stroke="#334155" stroke-width="4" stroke-linejoin="round" />
  <!-- Folded dog-ear corner -->
  <path d="M74 16v18a6 6 0 0 0 6 6h18" fill="#cbd5e1" stroke="#334155" stroke-width="4" stroke-linejoin="round" />
  <!-- Subtle document lines -->
  <line x1="36" y1="48" x2="68" y2="48" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <line x1="36" y1="60" x2="84" y2="60" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
  <!-- High-contrast PDF pill badge -->
  <rect x="16" y="72" width="76" height="30" rx="8" fill="url(#badgeGrad)" stroke="#991b1b" stroke-width="2.5" />
  <text x="54" y="93" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="18" font-weight="800" letter-spacing="1.2" fill="#ffffff">PDF</text>
</svg>
